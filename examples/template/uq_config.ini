[ModelA]
executable = ./../PhysiCell-master/project
configfile_ref = config/PhysiCell_settings.xml
numreplicates = 5
parameters = { 
		".//parallel/omp_num_threads" : '1',
		".//save/SVG/enable" : 'false',
		".//save/full_data/interval" : '240',
		".//cell_definitions/cell_definition[@name='default']/phenotype/cycle[@name='live']/phase_durations/duration[1]" : [None, 'cell_cycle_entry'],
		".//cell_definitions/cell_definition[@name='default']/phenotype/death/model[@name='apoptosis']/death_rate" : [None, 'apoptosis_rate'],
	}

[ModelB]
executable = ./../PhysiCell-master/project
configfile_ref = config/PhysiCell_settings_models.xml
numreplicates = 5
parameters = { 
		".//parallel/omp_num_threads" : '1',
		".//save/SVG/enable" : 'false',
		".//save/full_data/interval" : '240',
		".//cell_definitions/cell_definition[@name='default']/phenotype/cycle[@name='live']/phase_transition_rates/rate[1]" : 0.0,
		".//cell_definitions/cell_definition[@name='default']/phenotype/death/model[@name='apoptosis']/death_rate" : [None, 'apoptosis_rate'],
	}
rulesfile_ref = config/cell_rules_oxygen.csv
parameters_rules = {
		'default,oxygen,increases,cycle entry,saturation' : [None, 'oxygen_cell_cycle_entry_sat'],
		'default,oxygen,increases,cycle entry,half_max' : [None, 'oxygen_cell_cycle_entry_hfm'],
	}

